# ============================================================
# Streamlit 项目级配置
# 官方配置项参考：https://docs.streamlit.io/develop/api-reference/configuration/config.toml
# 只使用官方文档中存在的配置项，不添加自定义键
# ============================================================

[server]
# 保存源码后自动重跑，便于初学者观察改动效果
runOnSave = true
# 文件监听策略：auto 由 Streamlit 自动选择（官方可选值：auto / watchdog / poll / none）
fileWatcherType = "auto"

[browser]
# 关闭匿名使用统计（官方支持的关闭方式）
gatherUsageStats = false

[theme]
# 只使用官方主题配置项
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#1F2937"
font = "sans serif"
